# =============================================================================
# MODEL ARCHITECTURE PARAMETERS
# =============================================================================

model_params:
  embedding_dim: 128          # Dimension of embeddings
  encoder_layer_num: 6        # Number of encoder layers
  qkv_dim: 16                 # Dimension per attention head
  head_num: 8                 # Number of attention heads
  ff_hidden_dim: 512          # Feed-forward hidden dimension
  ffd: 'siglu'                # FFN type: 'ffd' (standard) or 'siglu' (ParallelGatedMLP)
  norm_type: 'rms'            # Normalization: 'rms', 'layer', 'instance', 'none'
  p_num: 6                    # Number of constraints (6 by default): O, L, TW, B, MB, MD
  logit_clipping: 10          # Logit clipping parameter
  K: 3                        # Number of task-specific PLE experts
  
  # Feature switches
  use_gate: true              # Preference-gated block (Meng et al., 2026)
  use_ple: true               # PLE in main model (bundles FiLM, RoPE, GPT-2 init); baselines: PLE only


# =============================================================================
# NEURAL-ANCHORED ITERATED LOCAL SEARCH PARAMETERS
# =============================================================================

tester_params:
  use_refinement: false        # Use AILS-II refinement
  ls_nb_granular: 30           # LS neighbourhood granularity (varphi in AILS-II; default 40)
  stop_condition: 'iterations' # 'iterations' or 'time' (ILS stopping criterion)
  num_iters: 250               # Max iterations (when stop_condition=iterations)
  num_seconds: null            # Wall-clock budget incl. neural decode (time mode); null in test_lib / Set-X ablation => 240*(n-1)/100
  dmax: 10                     # Initial target edge-distance between ref and post-LS solution (AILS-II default: 30)
  dmin: 5                      # Final target edge-distance (AILS-II default: 15)
  gamma: 30                    # Omega adjustment interval in iterations (AILS-II default: 30)
  eta_min: 0.01                # Minimum acceptance relaxation η (AILS-II default: 0.01)


# =============================================================================
# TRAINING PARAMETERS (16 VRP Variants)
# =============================================================================

trainer_params:
  epochs: 300                 # Total training epochs
  train_episodes: 100000      # Training instances per epoch
  model_save_interval: 10     # Save checkpoint every N epochs
  use_amp: true               # Automatic Mixed Precision (BF16/FP16)
  
  # Loss function
  loss_function: 'po'         # 'po' (Preference Optimization) or 'rl' (REINFORCE)
  po_alpha: 0.05              # PO temperature parameter
  po_B: null                  # Number of solutions generated per instance (null = all POMO starts)
  
  # Local search
  use_ls: true                # Enable local search during training
  ls_start_epoch: 250         # Epoch to activate local search
  ls_nb_granular: 20          # Neighbourhood granularity for PyVRP local search


# =============================================================================
# OPTIMIZER PARAMETERS (Main Training)
# =============================================================================

optimizer_params:
  optimizer:
    lr: 3e-4                     # Learning rate
    weight_decay: 1e-6           # L2 regularization
  scheduler:
    name: 'MultiStepLR'          # LR scheduler type ('MultiStepLR' by default, others are not implemented)
    milestones: [270, 295]       # Epochs to decay LR
    gamma: 0.1                   # LR decay factor


# =============================================================================
# FINE-TUNING PARAMETERS (32 Unseen Variants), following Berto et al. (2025)
# =============================================================================

tuner_params:
  epochs: 10                  # Fine-tuning epochs
  train_episodes: 10000       # Instances per epoch for fine-tuning
  model_save_interval: 10     # Save checkpoint every N epochs
  test_interval: 10           # Test every N epochs during fine-tuning
  use_amp: true               # Automatic Mixed Precision
  
  # Loss function
  loss_function: 'po'         # 'po' (Preference Optimization) or 'rl' (REINFORCE)
  po_alpha: 0.05              # PO temperature parameter
  po_B: null                  # Number of solutions generated per instance (null = all POMO starts)
  
  # Local search
  use_ls: true                # Enable local search during fine-tuning
  ls_start_epoch: 8           # Epoch to activate local search
  ls_nb_granular: 20          # Neighbourhood granularity for PyVRP local search
  
  # Variant selection
  # 'mb': 8 mixed backhaul single-depot variants
  # 'md': 16 multi-depot variants  
  # 'both': 8 multi-depot with mixed backhaul
  variant_present: 'both'


# =============================================================================
# FINE-TUNING OPTIMIZER PARAMETERS
# =============================================================================

tuner_optimizer_params:
  optimizer:
    lr: 3e-4                  # Learning rate for fine-tuning
    weight_decay: 1e-6        # L2 regularization
  scheduler:
    name: 'MultiStepLR'       # LR scheduler type ('MultiStepLR' by default, others are not implemented)
    milestones: []            # Epochs to decay LR
    gamma: 0.1                # LR decay factor


# =============================================================================
# ENVIRONMENT & DATA PARAMETERS
# =============================================================================

env:
  generator_params:
    num_loc: 50               # Number of customer nodes (50 or 100)
    variant_preset: 'all'     # Variants to sample: 'all' (all 16 variants) or it can be individual variants
  
  # Testing
  test_epoch: [50, 150]       # Additional test epochs
  test_interval: 10           # Test every N epochs during training
  test_episodes: 1000         # Number of test instances per evaluation
  test_batch_size: 500        # Batch size for testing
  data_dir: './data'          # Directory containing datasets
